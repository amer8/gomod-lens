<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <title>go.mod Lens</title>
    <meta name="description" content="Visualization of Go module dependencies inspired by npm.anvaka.com">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./assets/main.css">
    <script type="importmap">
      {
        "imports": {
          "ngraph.forcelayout": "./assets/vendor/ngraph.forcelayout.js",
          "ngraph.graph": "./assets/vendor/ngraph.graph.js",
          "ngraph.svg": "./assets/vendor/ngraph.svg.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app" class="full">
      <div id="graph-canvas" class="graph-empty"></div>
      <div id="left-panel" class="left-panel left-panel-empty">
        <div id="navbar-component" class="navbar-component navbar-component-empty">
          <form id="search-form" class="search" role="search">
            <div class="control-stack">
              <div class="input-group">
                <input
                  id="module-target"
                  name="target"
                  autofocus
                  type="text"
                  class="form-control"
                  placeholder="golang.org/x/tools@latest"
                  spellcheck="false"
                  autocomplete="off"
                >
                <span class="input-group-btn">
                  <button id="analyze-button" class="btn" type="submit">Analyze</button>
                </span>
              </div>
            </div>
          </form>
          <div id="graph-progress" class="graph-progress compact" hidden>
            <h4>Resolving graph <span id="loading-progress">0</span>%..</h4>
          </div>
          <div id="graph-errors" class="graph-errors compact" hidden>
            <h4>Graph build failed</h4>
            <div id="error-message" class="error-message"></div>
          </div>
        </div>
        <div class="panel-intro">
          <div class="attribution-row panel-attribution">
            <a
              class="attribution-mascot-link"
              href="https://github.com/amer8/gomod-lens"
              target="_blank"
              rel="noreferrer"
              aria-label="Open gomod-lens repository on GitHub"
              title="Open repository on GitHub"
            >
              <img
                class="attribution-mascot"
                src="./assets/gopher-63.svg"
                width="72"
                height="72"
                alt="go.mod Lens gopher mascot"
                loading="lazy"
                decoding="async"
              >
            </a>
            <p class="data-attribution">
              Module metadata from
              <a href="https://proxy.golang.org/" target="_blank" rel="noreferrer">Go module mirror</a>;
              <a href="https://securityscorecards.dev/" target="_blank" rel="noreferrer">OpenSSF Scorecard</a>
              scores and project metadata from
              <a href="https://deps.dev/" target="_blank" rel="noreferrer">deps.dev</a>;
              suggestions from
              <a href="https://docs.github.com/en/rest/search/search" target="_blank" rel="noreferrer">GitHub Search</a>.
            </p>
          </div>
        </div>
        <div id="graph-result" data-state="empty"></div>
      </div>
      <a
        class="github-link"
        href="https://github.com/amer8/gomod-lens"
        target="_blank"
        rel="noreferrer"
        aria-label="Open gomod-lens repository on GitHub"
        title="Open repository on GitHub"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            fill="currentColor"
            d="M12 2C6.48 2 2 6.58 2 12.26c0 4.54 2.87 8.39 6.84 9.75.5.09.68-.22.68-.49 0-.24-.01-.89-.01-1.75-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.08 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.31.1-2.72 0 0 .84-.28 2.75 1.05A9.36 9.36 0 0 1 12 6.97c.85 0 1.71.12 2.51.35 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.64 1.03 2.76 0 3.95-2.34 4.82-4.57 5.07.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.8 0 .27.18.59.69.49A10.06 10.06 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z"
          ></path>
        </svg>
        <span class="github-link-label">View code</span>
      </a>
    </div>
    <script src="./assets/wasm_exec.js"></script>
    <script type="module" src="./assets/app-static.js"></script>
  </body>
</html>
