name: Release Pages

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and upload Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static WASM artifact
        run: make wasm

      - name: Verify static artifact
        run: |
          test -f dist/index.html
          test -f dist/assets/gomod-lens.wasm
          test -f dist/assets/wasm_exec.js
          test -f dist/assets/app.js
          test -f dist/assets/wasm-client.js
          test -f dist/assets/vendor/ngraph.forcelayout.js
          test ! -e dist/assets/assistant/dev-checks.html
          test ! -e dist/assets/assistant/dev-checks.js
          test -f dist/privacy.html
          test -f dist/notices.html
          test -f dist/assets/licenses/Go.txt
          test -f dist/assets/licenses/CDLA-Permissive-2.0.txt
          test -f dist/assets/licenses/Llama-3.2.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy dist to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
